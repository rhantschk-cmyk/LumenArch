LABEL lumen-installer
TEXT HELP
  Start the full-screen Lumen offline installer.
ENDTEXT
MENU LABEL Start ^Lumen Arch Installer
LINUX boot/x86_64/vmlinuz-linux
INITRD boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.unit=lumen-installer.service
