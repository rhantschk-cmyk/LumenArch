[window]
opacity = 0.94
padding = { x = 14, y = 12 }
dynamic_title = true

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
size = 12.5

[colors.primary]
background = "#11111b"
foreground = "#cdd6f4"

[colors.normal]
blue = "#89b4fa"
cyan = "#94e2d5"
green = "#a6e3a1"
magenta = "#cba6f7"
red = "#f38ba8"
yellow = "#f9e2af"
