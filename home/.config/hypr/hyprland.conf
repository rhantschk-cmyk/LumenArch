# Lumen Arch — Hyprland session
$terminal = alacritty
$menu = $HOME/.config/lumen/bin/lumen-menu
$files = thunar
$browser = firefox
$mainMod = SUPER

monitor = ,preferred,auto,1
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = swaync
exec-once = quickshell -c lumen
exec-once = hypridle
exec-once = $HOME/.config/lumen/scripts/wallpaper.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244bb)
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.94
    shadow { enabled = true; range = 18; render_power = 3; color = rgba(00000066) }
    blur { enabled = true; size = 5; passes = 3; vibrancy = 0.18 }
}

animations {
    enabled = true
    bezier = soft, 0.25, 0.9, 0.2, 1.0
    animation = windows, 1, 5, soft, slide
    animation = border, 1, 6, soft
    animation = fade, 1, 5, soft
    animation = workspaces, 1, 4, soft, slidevert
}

input {
    kb_layout = de
    follow_mouse = 1
    touchpad { natural_scroll = true; tap-to-click = true }
}

dwindle { pseudotile = true; preserve_split = true }
misc { disable_hyprland_logo = true; force_default_wallpaper = 0; vrr = 1 }

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Space, exec, $menu
bind = $mainMod, E, exec, $files
bind = $mainMod, B, exec, $browser
bind = $mainMod, O, exec, obs
bind = $mainMod, N, exec, $terminal -e nvim
bind = $mainMod, T, exec, $terminal -e tmux new-session -A -s workspace
bind = $mainMod, G, exec, $terminal -e lazygit
bind = $mainMod, M, exec, obsidian
bind = $mainMod SHIFT, M, exec, typora
bind = $mainMod, U, exec, $terminal -e $HOME/.config/lumen/bin/lumenctl
bind = $mainMod, S, exec, $HOME/.config/lumen/bin/lumen-screenshot
bind = $mainMod, D, exec, $terminal -e lazydocker
bind = $mainMod, comma, exec, $terminal -e hyprmon
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod, Escape, exec, swaync-client -t -sw
bind = , Print, exec, grim "$HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png"
bind = $mainMod, Print, exec, slurp | grim -g - "$HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png"
bind = $mainMod SHIFT, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mainMod, R, exec, quickshell -c lumen -r
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

windowrule = float, match:class ^(pavucontrol|org.gnome.FileRoller|org.gnome.Evince)$
windowrule = size 900 650, match:class ^(pavucontrol|org.gnome.FileRoller|org.gnome.Evince)$
